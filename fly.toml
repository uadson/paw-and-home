# fly.toml - Configuração de Deploy para Fly.io (Free Tier)
# Monitoramento e Control Plane da aplicação Paw & Home

app = "paw-and-home-monitor"
primary_region = "iad"

[build]
  dockerfile = "infra/docker/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
